# SPDX-License-Identifier: LGPL-3.0-or-later
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "eeemcal-pi0"
version = "0.1.0"
description = "Candidate relative channel gains from reconstructed two-photon showers"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "NOTICE.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.6", "uproot>=5", "awkward>=2", "PyYAML>=6"]
[project.scripts]
pi0-calibrate = "eeemcal_pi0.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
